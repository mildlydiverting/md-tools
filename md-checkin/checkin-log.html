<!DOCTYPE html>
<!--
  Three Things — v5.0 (2026-11-21)
  Changelog
  v5.0: Live from Workflowy. No file to drop. Today's three things are
        mirrors under a "Three things" heading on the day's calendar
        page. Tick to complete, untick to reopen; both write straight to
        Workflowy. Pick a task from a dropdown (Inbox, or still open from
        earlier days) or type a new one: new ones go to the Inbox first,
        then get mirrored onto today. "Take off today" removes today's
        mirror only. Custom checkboxes and dropdowns from the tokens.
        The API key lives in config.js (gitignored).
  v4.0: Simpler TaskPaper version: NEXT: lines need just @date().
  v3.1: Restyled from md-design-system (mildlydiverting.com).
  v3.0: Two panes, light and dark themes.
  v2.0: Read a TaskPaper todo file. Read only.
  v1.0: Local page with its own form and browser storage.
  Pairs with the three-things-checkin skill and wf_checkin.py (same folder).
-->
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three Things</title>
<script>
  // Set the theme before the page draws, so there is no flash.
  (function () {
    let t = null;
    try { t = localStorage.getItem('three-things::theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Karla:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
  /* ===================================================================
     TOKENS — copied from md-design-system (mildlydiverting.com).
     Light = src/themes/default.css, values unchanged.
     Type and spacing = src/css/01-tokens.css (Utopia, 18 → 20px base).
     =================================================================== */
  :root {
    --font-body: 'Karla', sans-serif;
    --font-mono: 'Courier New', Courier, monospace;
    --text-sm:   clamp(0.938rem, 0.908rem + 0.149vw, 1.042rem);
    --text-base: clamp(1.125rem, 1.089rem + 0.179vw, 1.25rem);
    --text-md:   clamp(1.35rem,  1.307rem + 0.214vw, 1.5rem);
    --text-2xl:  clamp(2.333rem, 2.259rem + 0.37vw,  2.592rem);
    --space-3xs: clamp(0.281rem, 0.272rem + 0.045vw, 0.313rem);
    --space-2xs: clamp(0.563rem, 0.545rem + 0.089vw, 0.625rem);
    --space-xs:  clamp(0.844rem, 0.817rem + 0.134vw, 0.938rem);
    --space-s:   clamp(1.125rem, 1.089rem + 0.179vw, 1.25rem);
    --space-m:   clamp(1.688rem, 1.634rem + 0.268vw, 1.875rem);
    --space-l:   clamp(2.25rem,  2.179rem + 0.357vw, 2.5rem);
    --space-xl:  clamp(3.375rem, 3.268rem + 0.536vw, 3.75rem);
    --radius-s: 2px;
    --radius-m: 4px;
    --wrapper-max: 68rem;
    --border: 1px solid var(--color-border);

  :root, [data-theme="light"] {
    --color-bg:           #ffffff;
    --color-surface:      #f5f5f5;
    --color-text:         #1a1a1a;
    --color-text-muted:   #595959;
    --color-border:       #d4d4d0;
    --color-accent:       #bd463b;
    --color-accent-hover: #9c3a30;
    --color-cta-bg:       #bd463b;

  }
  /* Dark: derived, as in v3.1 (the design system has no dark default yet). */
  [data-theme="dark"] {
    --color-bg:           #2b2b2b;

  }

  /* =================================================================== GLOBAL */
  * { box-sizing: border-box; }
  body { margin:0; background:var(--color-bg); color:var(--color-text); font-family:var(--font-body); font-size:var(--text-base); line-height:1.5; padding:var(--space-l) var(--space-m); min-height:100vh; }
  a { color:var(--color-accent); transition:color var(--transition); }
  a:hover { color:var(--color-accent-hover); }
  :focus-visible { outline:var(--focus-ring); outline-offset:var(--focus-ring-offset); }
  .wrap { max-width:var(--wrapper-max); margin-inline:auto; }
  [hidden] { display:none !important; }

  /* =================================================================== HEADER */
  header { display:flex; align-items:flex-start; gap:var(--space-s); margin-block-end:var(--space-l); }
  h1 { font-weight:700; font-size:var(--text-2xl); line-height:1.1; margin:0 0 var(--space-3xs); }
  .sub { font-size:var(--text-sm); color:var(--color-text-muted); }
  .header-buttons { margin-inline-start:auto; display:flex; gap:var(--space-2xs); flex-wrap:wrap; justify-content:flex-end; }

  /* =================================================================== LAYOUT */
  .panes { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.2fr); gap:var(--space-xl); align-items:start; }
  @media (max-width: 54rem) { .panes { grid-template-columns:1fr; } }
  .pane-title { font-weight:700; font-size:var(--text-md); margin:0 0 var(--space-s); }
  .sub-title { font-weight:700; font-size:var(--text-base); margin:var(--space-l) 0 var(--space-2xs); }

  /* =================================================================== FORM */
  .slot { margin-block-end:var(--space-m); }
  .slot-label { display:block; font-weight:700; margin:0 0 var(--space-2xs); }
  .or { display:block; font-size:var(--text-sm); color:var(--color-text-muted); margin:var(--space-3xs) 0; }
  input[type=text] { display:block; inline-size:100%; font-family:inherit; font-size:var(--text-base); padding:var(--space-2xs); border:var(--border); border-radius:var(--radius-m); background:var(--color-bg); color:var(--color-text); }
  input[type=text]::placeholder { color:var(--color-text-muted); }
  input[type=text]:hover { border-color:var(--color-text-muted); }

  /* ---- Dropdown: native <select> for keyboard and screen readers,
          redrawn to match the text inputs. Chevron drawn in CSS so it
          follows the theme colour. */
  .select { position:relative; display:block; }
  .select select {
    appearance:none; -webkit-appearance:none;
    display:block; inline-size:100%;
    font-family:inherit; font-size:var(--text-base); line-height:1.5;
    padding:var(--space-2xs) calc(var(--space-2xs) * 4) var(--space-2xs) var(--space-2xs);
    border:var(--border); border-radius:var(--radius-m);
    background:var(--color-bg); color:var(--color-text);
    cursor:pointer; text-overflow:ellipsis;
  }
  .select select:hover { border-color:var(--color-text-muted); }
  .select::after {
    content:""; position:absolute; pointer-events:none;
    inset-inline-end:var(--space-xs); inset-block-start:50%;
    inline-size:0.55em; block-size:0.55em;
    border-inline-end:2px solid var(--color-text-muted);
    border-block-end:2px solid var(--color-text-muted);
    transform:translateY(-70%) rotate(45deg);
  }
  .select select:disabled { color:var(--color-text-muted); cursor:default; }
  .select select option, .select select optgroup { background:var(--color-bg); color:var(--color-text); }

  /* ---- Checkbox: native input, redrawn. Square, terracotta when ticked,
          a drawn tick (no icon font). */
  .check {
    appearance:none; -webkit-appearance:none; margin:0; flex:none;
    inline-size:var(--control-size); block-size:var(--control-size);
    border:2px solid var(--color-text-muted); border-radius:var(--radius-s);
    background:var(--color-bg); cursor:pointer; position:relative;
    transition:background var(--transition), border-color var(--transition);
  }
  .check:hover { border-color:var(--color-accent); }
  .check:checked { background:var(--color-cta-bg); border-color:var(--color-cta-bg); }
  .check:checked::after {
    content:""; position:absolute;
    inset-inline-start:30%; inset-block-start:10%;
    inline-size:32%; block-size:58%;
    border-inline-end:3px solid var(--color-cta-text);
    border-block-end:3px solid var(--color-cta-text);
    transform:rotate(45deg);
  }
  .check:disabled { opacity:0.5; cursor:progress; }

  /* =================================================================== BUTTONS */
  button { font-family:inherit; font-weight:700; font-size:var(--text-sm); text-transform:uppercase; letter-spacing:0.05em; padding:var(--space-2xs) var(--space-s); cursor:pointer; border:2px solid var(--color-cta-bg); border-radius:var(--radius-m); background:var(--color-cta-bg); color:var(--color-cta-text); transition:opacity var(--transition); }
  button.secondary { background:transparent; color:var(--color-accent); border-color:var(--color-accent); }
  button.quiet { background:transparent; border-color:transparent; color:var(--color-accent); text-transform:none; letter-spacing:0; font-weight:500; padding:var(--space-3xs) var(--space-2xs); text-decoration:underline; text-underline-offset:0.2em; }
  button:hover { opacity:0.85; }
  button:disabled { opacity:0.5; cursor:progress; }
  .buttons { display:flex; flex-wrap:wrap; gap:var(--space-2xs); }

  /* =================================================================== MESSAGES */
  .note { font-size:var(--text-sm); padding:var(--space-2xs) var(--space-xs); background:var(--color-surface); border-radius:var(--radius-m); margin-block:var(--space-s); }
  .note code { font-family:var(--font-mono); }
  .status { font-size:var(--text-sm); color:var(--color-accent); font-weight:500; margin-block-start:var(--space-2xs); min-height:1.5em; }
  .muted { color:var(--color-text-muted); font-size:var(--text-sm); }

  /* =================================================================== TASK LISTS */
  .tasks { list-style:none; margin:0; padding:0; }
  .task { display:flex; align-items:flex-start; gap:var(--space-xs); padding-block:var(--space-2xs); }
  .task label { flex:1; cursor:pointer; padding-block-start:0.05em; }
  .task.done label { text-decoration:line-through; color:var(--color-text-muted); }
  .task .actions { margin-inline-start:auto; display:flex; gap:var(--space-3xs); align-items:center; }

  .age { font-size:var(--text-sm); color:var(--color-accent); font-weight:700; white-space:nowrap; }
  .empty { color:var(--color-text-muted); padding-block:var(--space-2xs); }
</style>

<script src="config.js"></script>
<script>
/* ==== LOGIC (no DOM; tested by test_checkin_page.mjs) ================ */
const HEADING = 'Three things';
const API = 'https://workflowy.com/api/v1';

function makeApi(key, fetchFn) {
  const f = fetchFn || ((...a) => fetch(...a));
  async function req(method, path, body) {
    const r = await f(API + path, {
      method,
      headers: Object.assign({ Authorization: 'Bearer ' + key },
                             body ? { 'Content-Type': 'application/json' } : {}),
      body: body ? JSON.stringify(body) : undefined
    });
    if (r.status === 404) { const e = new Error('not found'); e.notFound = true; throw e; }
    if (r.status === 401) throw new Error('Workflowy says the API key is not valid.');
    if (r.status === 429) throw new Error('Workflowy asked us to slow down. Try again in a minute.');
    if (!r.ok) throw new Error('Workflowy error ' + r.status + '.');
    const t = await r.text();
    return t ? JSON.parse(t) : {};
  }
  return {
    children: id => req('GET', '/nodes?parent_id=' + encodeURIComponent(id)).then(r => r.nodes || []),
    node: id => req('GET', '/nodes/' + encodeURIComponent(id)).then(r => r.node),
    create: body => req('POST', '/nodes', body),
    mirror: (id, parent) => req('POST', '/nodes/' + id + '/mirror', { parent_id: parent, position: 'bottom' }),
    unmirror: id => req('DELETE', '/nodes/' + id + '/mirror'),
    complete: id => req('POST', '/nodes/' + id + '/complete', {}),
    uncomplete: id => req('POST', '/nodes/' + id + '/uncomplete', {})
  };
}

function isoDay(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function addDays(iso, n) {
  const [y, m, d] = iso.split('-').map(Number);
  return isoDay(new Date(y, m - 1, d + n));
}
function daysBetween(a, b) {
  const n = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
  return Math.round((n(b) - n(a)) / 86400000);
}
function plain(html) {
  return String(html || '').replace(/<[^>]+>/g, '')
    .replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&').trim();
}
const byPriority = (a, b) => (a.priority || 0) - (b.priority || 0);

// Run fn over items, at most `limit` at once (gentle on the API).
async function mapLimit(items, limit, fn) {
  const out = new Array(items.length);
  let i = 0;
  async function worker() { while (i < items.length) { const n = i++; out[n] = await fn(items[n], n); } }
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
  return out;
}

async function findHeading(api, day) {
  let kids;
  try { kids = await api.children(day); } catch (e) { if (e.notFound) return null; throw e; }
  const h = kids.find(n => plain(n.name) === HEADING);
  return h ? h.id : null;
}

// Creating the heading also creates the calendar day if it's missing.
async function ensureHeading(api, day) {
  return (await findHeading(api, day)) ||
    (await api.create({ parent_id: day, name: HEADING, layoutMode: 'h2', position: 'top' })).item_id;
}

// Read the last `windowDays` of Three things, plus the Inbox.
async function collect(api, today, windowDays) {
  const days = [];
  for (let i = windowDays; i >= 0; i--) days.push(addDays(today, -i));
  const headings = await mapLimit(days, 4, d => findHeading(api, d));
  const lists = await mapLimit(days, 4, (d, n) => headings[n] ? api.children(headings[n]) : Promise.resolve([]));

  const tasks = new Map();   // origin id -> record
  days.forEach((d, n) => {
    lists[n].slice().sort(byPriority).forEach((child, pos) => {
      const originId = (child.data && child.data.mirror && child.data.mirror.origin_id) || child.id;
      let rec = tasks.get(originId);
      if (!rec) {
        rec = { id: originId, text: plain(child.name), done: !!child.completed, firstDate: d, dates: [], mirrors: {} };
        tasks.set(originId, rec);
      }
      rec.dates.push(d);
      rec.mirrors[d] = child.id;
      if (d === today) rec.todayPos = pos;
    });
  });

  // The origin is the source of truth for done and text.
  await mapLimit([...tasks.values()], 4, async rec => {
    try {
      const o = await api.node(rec.id);
      if (o) { rec.done = !!o.completed; rec.text = plain(o.name) || rec.text; }
    } catch (e) { if (!e.notFound) throw e; }
  });

  let inbox = [];
  try { inbox = (await api.children('inbox')).filter(n => !n.completed).sort(byPriority); }
  catch (e) { if (!e.notFound) throw e; }

  const all = [...tasks.values()].map(r => Object.assign(r, {
    daysOn: daysBetween(r.firstDate, today),
    onToday: r.dates.includes(today)
  }));
  all.forEach(r => { r.slipping = !r.done && r.daysOn > 0; });
  const onToday = new Set(all.filter(r => r.onToday).map(r => r.id));
  return {
    today,
    todayItems: all.filter(r => r.onToday).sort((a, b) => a.todayPos - b.todayPos),
    earlier: all.filter(r => !r.onToday && !r.done).sort((a, b) => b.daysOn - a.daysOn),
    inbox: inbox.filter(n => !onToday.has(n.id)).map(n => ({ id: n.id, text: plain(n.name) }))
  };
}

// Add picks and new text to today. Returns { added, skipped }.
async function addToToday(api, today, entries, onTodayIds) {
  const added = [], skipped = [];
  const seen = new Set(onTodayIds);
  let heading = null;
  for (const e of entries) {
    let id = e.id;
    if (!id) {
      if (!e.text) continue;
      id = (await api.create({ parent_id: 'inbox', name: e.text, layoutMode: 'todo', position: 'bottom' })).item_id;
    }
    if (seen.has(id)) { skipped.push(e.text || id); continue; }
    heading = heading || await ensureHeading(api, today);
    await api.mirror(id, heading);
    seen.add(id);
    added.push(e.text || id);
  }
  return { added, skipped };
}

if (typeof module !== 'undefined') module.exports = { makeApi, collect, addToToday, ensureHeading, addDays, daysBetween, plain };
/* ==== END LOGIC ====================================================== */
</script>
<script>
/* ==== PAGE =========================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const store = {
  get(k) { try { return localStorage.getItem('three-things::' + k); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('three-things::' + k, v); } catch (e) {} },
  del(k) { try { localStorage.removeItem('three-things::' + k); } catch (e) {} }
};
const plural = n => n + ' day' + (n === 1 ? '' : 's');

const CONFIG = window.CHECKIN_CONFIG || {};
const KEY = (CONFIG.workflowyKey || '').trim();
const WINDOW = Number(CONFIG.windowDays) || 14;
const TODAY = isoDay(new Date());
$('todayLabel').textContent = new Date().toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long' });

// ---- Theme
function showTheme() {
  const dark = document.documentElement.dataset.theme === 'dark';
  $('themeToggle').textContent = dark ? 'Light mode' : 'Dark mode';
  $('themeToggle').setAttribute('aria-pressed', String(dark));
}
$('themeToggle').onclick = () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  store.set('theme', t);
  showTheme();
};
showTheme();

// ---- No key: explain, stop.
if (!KEY) {
  $('setup').hidden = false;
  $('panes').hidden = true;
  $('refresh').hidden = true;
  $('setup').innerHTML = '<strong>Add your Workflowy key to start.</strong><br>' +
    '1. In Terminal: <code>security find-generic-password -s WORKFLOWY_API_KEY -w | pbcopy</code><br>' +
    '2. Open <code>config.js</code> in this folder and paste it as <code>workflowyKey: "…"</code><br>' +
    '3. Reload this page.<br>' +
    '<code>config.js</code> is gitignored. Never share it: the key can edit your whole Workflowy.';
} else {
  start();
}

function start() {
  const api = makeApi(KEY);
  let state = null;

  // ---- Form: three prompts, each a dropdown or new text.
  const PROMPTS = [
    ['Fixed in the diary today', 'e.g. teaching 10am'],
    ["Will feel worse if it doesn't move today", "e.g. reply to Jo's email"],
    ['Quick win', 'e.g. book dentist']
  ];
  $('form').innerHTML = PROMPTS.map(([label, ph], n) =>
    '<div class="slot" role="group" aria-labelledby="l' + n + '">' +
      '<span class="slot-label" id="l' + n + '">' + esc(label) + '</span>' +
      '<span class="select"><select id="s' + n + '" aria-label="' + esc(label) + ': pick a task"></select></span>' +
      '<span class="or">or a new one</span>' +
      '<input type="text" id="t' + n + '" aria-label="' + esc(label) + ': new task" placeholder="' + esc(ph) + '">' +
    '</div>'
  ).join('');
  const selects = PROMPTS.map((_, n) => $('s' + n));
  const inputs = PROMPTS.map((_, n) => $('t' + n));

  // Picking from the list clears the text box, and typing clears the pick,
  // so each slot is clearly one or the other.
  selects.forEach((s, n) => s.addEventListener('change', () => { if (s.value) inputs[n].value = ''; saveDraft(); }));
  inputs.forEach((i, n) => i.addEventListener('input', () => { if (i.value) selects[n].value = ''; saveDraft(); }));

  function saveDraft() {
    store.set('draft', JSON.stringify({ date: TODAY, text: inputs.map(i => i.value), pick: selects.map(s => s.value) }));
  }
  function loadDraft() {
    let d = null;
    try { d = JSON.parse(store.get('draft')); } catch (e) {}
    if (!d || d.date !== TODAY) return;
    inputs.forEach((i, n) => i.value = (d.text || [])[n] || '');
    selects.forEach((s, n) => { const v = (d.pick || [])[n]; if (v && [...s.options].some(o => o.value === v)) s.value = v; });
  }

  function fillSelects() {
    const group = (label, items) => items.length
      ? '<optgroup label="' + esc(label) + '">' + items.map(t => '<option value="' + esc(t.id) + '">' + esc(t.text) + '</option>').join('') + '</optgroup>'
      : '';
    const html = '<option value="">Pick a task…</option>' +
      group('Still open from earlier', state.earlier) + group('Inbox', state.inbox);
    const empty = !state.earlier.length && !state.inbox.length;
    selects.forEach(s => {
      const keep = s.value;
      s.innerHTML = empty ? '<option value="">Nothing open yet</option>' : html;
      s.disabled = empty;
      if ([...s.options].some(o => o.value === keep)) s.value = keep;
    });
  }

  $('addToday').onclick = async () => {
    const textFor = id => { for (const t of [...state.earlier, ...state.inbox]) if (t.id === id) return t.text; return id; };
    const entries = selects.map((s, n) => s.value
      ? { id: s.value, text: textFor(s.value) }
      : { text: inputs[n].value.trim() }).filter(e => e.id || e.text);
    if (!entries.length) { $('formStatus').textContent = 'Pick or write at least one thing first.'; return; }
    busy($('addToday'), true);
    $('formStatus').textContent = 'Adding…';
    try {
      const r = await addToToday(api, TODAY, entries, state.todayItems.map(t => t.id));
      inputs.forEach(i => i.value = ''); selects.forEach(s => s.value = ''); store.del('draft');
      $('formStatus').textContent = (r.added.length ? 'Added: ' + r.added.join(', ') + '.' : '') +
        (r.skipped.length ? ' Already on today: ' + r.skipped.join(', ') + '.' : '');
      await load();
    } catch (e) {
      $('formStatus').textContent = e.message;
      await load();   // something may have been added before the error
    } finally { busy($('addToday'), false); }
  };
  $('clearForm').onclick = () => {
    inputs.forEach(i => i.value = ''); selects.forEach(s => s.value = '');
    store.del('draft'); $('formStatus').textContent = '';
  };

  // ---- Today list
  function itemHTML(t, where) {
    const id = 'c-' + where + '-' + t.id;
    const slip = t.slipping;
    let actions = '';
    if (where === 'today' && t.mirrors[TODAY]) actions = '<button class="quiet" type="button" data-act="off" data-mirror="' + esc(t.mirrors[TODAY]) + '">Take off today</button>';
    if (where === 'earlier') actions = '<button class="quiet" type="button" data-act="carry" data-id="' + esc(t.id) + '">Add to today</button>';
    return '<li class="task' + (t.done ? ' done' : '') + '">' +
      '<input class="check" type="checkbox" id="' + esc(id) + '" data-id="' + esc(t.id) + '"' + (t.done ? ' checked' : '') + '>' +
      '<label for="' + esc(id) + '">' + (slip ? '<span class="mark" title="Slipping">!</span>' : '') + esc(t.text) + '</label>' +
      '<span class="actions">' + (slip ? '<span class="age" title="First on ' + esc(t.firstDate) + '">' + plural(t.daysOn) + '</span>' : '') + actions + '</span>' +
    '</li>';
  }

  function render() {
    $('todayList').innerHTML = state.todayItems.length
      ? state.todayItems.map(t => itemHTML(t, 'today')).join('')
      : '<li class="empty">Nothing on today yet.</li>';
    $('earlierBlock').hidden = !state.earlier.length;
    $('earlierList').innerHTML = state.earlier.map(t => itemHTML(t, 'earlier')).join('');
    const long = [...state.todayItems, ...state.earlier].some(t => t.slipping && t.daysOn >= 2);
    $('slipNote').hidden = !long;
    if (long) $('slipNote').textContent = 'Something has been here two days or more. Options: make it smaller, ask someone for help, or do an online pomodoro with friends.';
    $('footer').textContent = 'Inbox: ' + state.inbox.length + ' open. Updated ' +
      new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) + '.';
    fillSelects();
  }

  // Ticks write straight away; on failure the box goes back.
  document.addEventListener('change', async e => {
    const box = e.target;
    if (!box.classList || !box.classList.contains('check')) return;
    const id = box.dataset.id, done = box.checked;
    box.closest('.task').classList.toggle('done', done);
    box.disabled = true;
    try {
      await (done ? api.complete(id) : api.uncomplete(id));
      for (const t of [...state.todayItems, ...state.earlier]) if (t.id === id) { t.done = done; t.slipping = !done && t.daysOn > 0; }
      $('listStatus').textContent = '';
      render();
    } catch (err) {
      box.checked = !done;
      box.closest('.task').classList.toggle('done', !done);
      $('listStatus').textContent = err.message;
    } finally { box.disabled = false; }
  });

  document.addEventListener('click', async e => {
    const b = e.target.closest && e.target.closest('button[data-act]');
    if (!b) return;
    busy(b, true);
    try {
      if (b.dataset.act === 'off') await api.unmirror(b.dataset.mirror);
      if (b.dataset.act === 'carry') await addToToday(api, TODAY, [{ id: b.dataset.id }], state.todayItems.map(t => t.id));
      $('listStatus').textContent = '';
      await load();
    } catch (err) { $('listStatus').textContent = err.message; busy(b, false); }
  });

  function busy(btn, on) { btn.disabled = on; }

  async function load() {
    busy($('refresh'), true);
    $('listStatus').textContent = state ? '' : 'Loading from Workflowy…';
    try {
      state = await collect(api, TODAY, WINDOW);
      $('listStatus').textContent = '';
      render();
      loadDraft();
    } catch (e) {
      $('listStatus').textContent = e.message === 'Failed to fetch'
        ? "Couldn't reach Workflowy. Check you're online, then Refresh."
        : e.message;
    } finally { busy($('refresh'), false); }
  }
  $('refresh').onclick = load;
  window.addEventListener('focus', () => { if (state) load(); });  // fresh when you come back to the tab
  load();
}
</script>
</body>
</html>
